[project]
name = "lazyfinds"
version = "0.1.11"
description = "Find files on Windows by what is in them: pictures, PDFs, documents, audio, video. On-device, offline."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.3",
    "pillow>=11.3",
    "pillow-heif>=1.1",
    "pypdfium2>=4.30",
    "winrt-runtime>=3.2",
    "winrt-Windows.Foundation>=3.2",
    "winrt-Windows.Foundation.Collections>=3.2",
    "winrt-Windows.Globalization>=3.2",
    "winrt-Windows.Graphics.Imaging>=3.2",
    "winrt-Windows.Media.Ocr>=3.2",
    "winrt-Windows.Storage>=3.2",
    "winrt-Windows.Storage.Streams>=3.2",
    "PySide6-Essentials>=6.9",
    "watchdog>=6.0",
    "pyside6-addons>=6.9",
    "soundfile>=0.13",
]

[project.scripts]
lazyfinds = "lazyfinds.cli:main"

[project.gui-scripts]
lazyfinds-app = "lazyfinds.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lazyfinds"]

[dependency-groups]
dev = [
    "py7zr>=1.0",
    "pyinstaller>=6.16",
    "pytest>=8.4",
]
